<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Box · Experimentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yrsa:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex&display=swap" rel="stylesheet">
<style>
  :root{--creme:#FFFAF2;--laranja:#D1662A;--laranja-esc:#A84E1E;--marrom:#26150B;--cinza:#6E625A;--cinza-cl:#E9E1D6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--creme);color:var(--marrom);font-family:'Google Sans Flex','Google Sans',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.55;min-height:100vh}
  main{max-width:720px;margin:0 auto;padding:64px 20px 48px}
  .marca{display:flex;align-items:center;gap:12px;font-family:'Yrsa',Georgia,serif;font-weight:700;font-size:1.5rem;margin-bottom:40px}
  .rotulo{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--laranja);font-weight:600;margin-bottom:10px}
  h1{font-family:'Yrsa',Georgia,serif;font-size:clamp(2.2rem,8vw,3.4rem);line-height:1.1;margin-bottom:12px}
  .lead{font-size:1.1rem;color:#4a3a2f;max-width:520px;margin-bottom:36px}
  .lista{display:grid;gap:14px}
  a.app{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;background:rgba(255,255,255,.7);border:1.5px solid var(--cinza-cl);border-radius:20px;padding:18px 20px;transition:border-color .2s, transform .15s}
  a.app:hover{border-color:var(--laranja);transform:translateY(-2px)}
  a.app svg{flex:none}
  a.app strong{font-family:'Yrsa',Georgia,serif;font-size:1.35rem;display:block;line-height:1.2}
  a.app span{font-size:.93rem;color:var(--cinza)}
  a.app .seta{margin-left:auto;color:var(--laranja);font-size:1.4rem}
  footer{margin-top:56px;font-size:.85rem;color:var(--cinza)}
  footer a{color:var(--laranja-esc)}
</style>
</head>
<body>
<main>
  <div class="marca">
    <svg viewBox="0 0 120 100" width="40" aria-hidden="true">
      <polygon points="60,8 96,29 96,71 60,92 24,71 24,29" fill="none" stroke="#26150B" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="60,30 78,40 60,50 42,40" fill="#F0A472"/><polygon points="42,40 60,50 60,71 42,61" fill="#D1662A"/><polygon points="60,50 78,40 78,61 60,71" fill="#A84E1E"/>
    </svg>
    Little Box
  </div>
  <p class="rotulo">Experimentos</p>
  <h1>Ideias para pensar a IA</h1>
  <p class="lead">Pequenas experiências interativas sobre inteligência artificial, consciência e o que nos torna humanos.</p>

  <div class="lista">
    <a class="app" href="./corvo-ia/">
      <svg viewBox="0 0 120 100" width="52" aria-hidden="true">
        <path d="M20 62 C 22 40, 50 30, 72 36 C 84 39, 92 46, 88 57 C 85 68, 66 76, 44 74 L 6 86 L 20 70 Z" fill="#26150B"/>
        <path d="M34 52 C 48 42, 68 44, 76 55 C 62 62, 46 63, 34 52 Z" fill="#3E2718"/>
        <circle cx="86" cy="34" r="13" fill="#26150B"/><path d="M96 29 L 117 36 L 96 41 Z" fill="#26150B"/><circle cx="90" cy="31" r="2.3" fill="#FFFAF2"/>
        <line x1="54" y1="73" x2="51" y2="93" stroke="#26150B" stroke-width="3" stroke-linecap="round"/><line x1="65" y1="72" x2="67" y2="93" stroke="#26150B" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <div><strong>Tem alguém aí?</strong><span>O corvo, a IA e a consciência</span></div>
      <span class="seta">→</span>
    </a>
  </div>

  <footer><a href="https://littlebox.ai">littlebox.ai</a></footer>
</main>
</body>
</html>
