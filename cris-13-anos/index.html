<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz aniversário de casamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #140f22; }
  body { font-family: 'Cormorant Garamond', Georgia, serif; color: #fff6ec; -webkit-tap-highlight-color: transparent; }

  #cena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #capa { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 28px; background: #2a1f3d; cursor: pointer; z-index: 10; transition: opacity 1.4s ease 1s; }
  #capa.saindo { opacity: 0; pointer-events: none; }
  .envelope { position: relative; width: 260px; height: 170px; perspective: 800px; transition: transform 1.2s ease 0.6s; }
  #capa.saindo .envelope { transform: translateY(40px) scale(0.92); }
  .env-corpo { position: absolute; inset: 0; background: #f2e2cf; border-radius: 6px; overflow: hidden; }
  .env-corpo::before { content: ""; position: absolute; inset: 0; background: #e8d3bb;
                       clip-path: polygon(0 100%, 50% 45%, 100% 100%); }
  .env-corpo::after  { content: ""; position: absolute; inset: 0; background: #eddac4;
                       clip-path: polygon(0 0, 50% 55%, 0 100%, 100% 100%, 50% 55%, 100% 0, 100% 100%, 0 100%); opacity: .55; }
  .env-aba { position: absolute; left: 0; right: 0; top: 0; height: 100px; background: #e6cfb4;
             clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top center; transition: transform 1s ease;
             z-index: 2; }
  #capa.saindo .env-aba { transform: rotateX(180deg); z-index: 0; }
  .selo { position: absolute; left: 50%; top: 82px; width: 44px; height: 44px; margin-left: -22px; border-radius: 50%;
          background: #a8384f; z-index: 3; display: flex; align-items: center; justify-content: center; transition: opacity .4s; }
  #capa.saindo .selo { opacity: 0; }
  .selo svg { width: 20px; height: 20px; }
  .convite { font-size: 22px; font-style: italic; letter-spacing: .5px; opacity: .9; animation: pulsa 2.4s ease-in-out infinite; }
  .aviso { display: flex; align-items: center; gap: 12px; margin-top: 8px; padding: 12px 18px; border: 1px solid rgba(255,246,236,.25);
           border-radius: 14px; font-size: 17px; line-height: 1.35; color: rgba(255,246,236,.85); text-align: left; }
  .aviso svg { width: 26px; height: 26px; flex: none; }
  @keyframes pulsa { 50% { opacity: .45; } }

  #mensagem { position: fixed; left: 0; right: 0; top: 5vh; padding: 0 28px; text-align: center; z-index: 5; pointer-events: none; }
  #mensagem p { opacity: 0; transform: translateY(8px); transition: opacity 2s ease, transform 2s ease;
                font-size: clamp(18px, 4.9vw, 27px); line-height: 1.3; margin-bottom: 7px; text-shadow: 0 1px 12px rgba(60,20,40,.35); }
  #mensagem p.nomes { font-size: clamp(30px, 8.5vw, 48px); font-weight: 500; margin-bottom: 8px; }
  #mensagem p.assinatura { font-family: 'Great Vibes', cursive; font-size: clamp(34px, 9.5vw, 52px); margin: 8px 0 0; line-height: 1.1; }
  #mensagem p.data { font-size: clamp(14px, 3.8vw, 18px); font-style: italic; }
  #mensagem p.data.on { opacity: .8; }
  #mensagem p.tempo { font-size: clamp(16px, 4.2vw, 22px); font-style: italic; opacity: 0; margin-bottom: 22px; }
  #mensagem p.on { opacity: 1; transform: none; }
  #mensagem p.tempo.on { opacity: .85; }

  #som { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 9; width: 44px; height: 44px;
         border-radius: 50%; border: 1px solid rgba(255,246,236,.5); background: rgba(20,15,34,.35); color: #fff6ec;
         display: none; align-items: center; justify-content: center; cursor: pointer; }
  #som svg { width: 20px; height: 20px; }

  #fogos { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

  #presente { position: fixed; left: 50%; top: 52%; width: 120px; margin-left: -60px; z-index: 7; cursor: pointer; text-align: center;
              opacity: 0; transform: translateY(30px) scale(.6); transition: opacity 1.2s ease, transform 1.2s cubic-bezier(.2,1.4,.4,1);
              pointer-events: none; }
  #presente.on { opacity: 1; transform: none; pointer-events: auto; }
  #presente .caixa { animation: flutua 2.6s ease-in-out infinite; }
  #presente svg { width: 120px; height: 120px; overflow: visible; }
  #presente .tampa { transition: transform 1s cubic-bezier(.3,.1,.3,1), opacity 1s ease; transform-origin: 60px 40px; }
  #presente.aberto .tampa { transform: translate(30px, -110px) rotate(35deg); opacity: 0; }
  #presente.aberto .caixa { animation: none; }
  #presente.aberto { transition: opacity 1s ease 1s; opacity: 0; pointer-events: none; }
  #presente p { font-size: 18px; font-style: italic; margin-top: 4px; animation: pulsa 2.4s ease-in-out infinite; }
  @keyframes flutua { 50% { transform: translateY(-8px) rotate(-2deg); } }

<script>
/* ====== EDITE AQUI ====== */
const CARTAO = {
  nomes: "Cris & Ro",
  dataCasamento: "",            /* formato AAAA-MM-DD, ex.: "2015-11-21". Vazio = não mostra o tempo */
  frases: [
    "Meu amor,",
    "Treze anos, hem?",
    "Já vimos muitos pores do sol juntos.",
    "E o meu preferido ainda é o que vejo do seu lado.",
    "Que venham muitos mais... Agora fica só mais um pouquinho que hoje o pôr do sol vem com surpresa.",
    "Te amo!"
  ],
  assinatura: "Rodrigo",
  data: "10/11/26",
  presente: {
    texto: "Você ganhou 7 dias seguidos na AVVA para retomar a sua rotina de exercícios :)",
    convite: "Para agendar a sua semana, entre em contato pelo WhatsApp:",
    whatsapp: "5548991885441",               /* com 55 + DDD, só números */
    whatsappTexto: "48 99188-5441",
    mensagemPronta: "Oi! Ganhei 7 dias seguidos na AVVA e quero agendar a minha semana."
  }
};
/* ======================== */

const cena = document.getElementById('cena');
const capa = document.getElementById('capa');
const msg = document.getElementById('mensagem');
const botaoSom = document.getElementById('som');
cena.pauseAnimations();

function tempoJuntos(iso) {
  if (!iso) return "";
  const ini = new Date(iso + "T00:00:00");
  if (isNaN(ini)) return "";
  const hoje = new Date();
  let anos = hoje.getFullYear() - ini.getFullYear();
  const aniv = new Date(hoje.getFullYear(), ini.getMonth(), ini.getDate());
  if (hoje < aniv) anos--;
  const dias = Math.floor((hoje - ini) / 86400000);
  const a = anos === 1 ? "1 ano" : anos + " anos";
  return a + " · " + dias.toLocaleString("pt-BR") + " dias juntos";
}

function montarMensagem() {
  const linhas = [{ t: CARTAO.nomes, c: "nomes" }];
  const tj = tempoJuntos(CARTAO.dataCasamento);
  if (tj) linhas.push({ t: tj, c: "tempo" });
  CARTAO.frases.forEach(f => linhas.push({ t: f, c: "" }));
  if (CARTAO.assinatura) linhas.push({ t: CARTAO.assinatura, c: "assinatura" });
  if (CARTAO.data) linhas.push({ t: CARTAO.data, c: "data" });
  linhas.forEach((l, i) => {
    const p = document.createElement("p");
    p.textContent = l.t;
    if (l.c) p.className = l.c;
    msg.appendChild(p);
    setTimeout(() => p.classList.add("on"), l.c === "data" ? 3000 + (i - 1) * 4000 + 1500 : 3000 + i * 4000);
  });
}

/* ====== SOM: mar e pássaros (gerado no navegador) ====== */
let ctx, master, ligado = true;

function iniciarSom() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ctx = new AC();
  master = ctx.createGain();
  master.gain.setValueAtTime(0, ctx.currentTime);
  master.gain.linearRampToValueAtTime(0.9, ctx.currentTime + 4);
  master.connect(ctx.destination);

  const rev = ctx.createConvolver();
  const len = ctx.sampleRate * 2.5;
  const ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  }
  rev.buffer = ir;
  const revG = ctx.createGain(); revG.gain.value = 0.35;
  rev.connect(revG).connect(master);

  function ruido(seg, marrom) {
    const buf = ctx.createBuffer(2, ctx.sampleRate * seg, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c); let last = 0;
      for (let i = 0; i < d.length; i++) {
        const w = Math.random() * 2 - 1;
        if (marrom) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w * 0.5;
      }
    }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true; src.start();
    return src;
  }

  /* fundo: mar distante, sempre presente */
  const fundo = ruido(7, true);
  const fLp = ctx.createBiquadFilter(); fLp.type = "lowpass"; fLp.frequency.value = 420;
  const fG = ctx.createGain(); fG.gain.value = 0.22;
  const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
  const lfoG = ctx.createGain(); lfoG.gain.value = 0.1;
  lfo.connect(lfoG).connect(fG.gain); lfo.start();
  fundo.connect(fLp).connect(fG).connect(master);

  /* ondas quebrando na areia */
  const espuma = ruido(5, false);
  const bp = ctx.createBiquadFilter(); bp.type = "lowpass"; bp.frequency.value = 300; bp.Q.value = 0.7;
  const eG = ctx.createGain(); eG.gain.value = 0;
  espuma.connect(bp).connect(eG); eG.connect(master); eG.connect(rev);
  const corpo = ruido(6, true);
  const cLp = ctx.createBiquadFilter(); cLp.type = "lowpass"; cLp.frequency.value = 600;
  const cG = ctx.createGain(); cG.gain.value = 0;
  corpo.connect(cLp).connect(cG).connect(master);

  function onda(t) {
    const forca = 0.6 + Math.random() * 0.4;
    const sobe = 2.2 + Math.random(), desce = 4.5 + Math.random() * 2;
    eG.gain.cancelScheduledValues(t); eG.gain.setValueAtTime(eG.gain.value, t);
    eG.gain.linearRampToValueAtTime(0.02 * forca, t + sobe * 0.6);
    eG.gain.linearRampToValueAtTime(0.11 * forca, t + sobe);
    eG.gain.exponentialRampToValueAtTime(0.004, t + sobe + desce);
    bp.frequency.cancelScheduledValues(t); bp.frequency.setValueAtTime(300, t);
    bp.frequency.exponentialRampToValueAtTime(2600, t + sobe);
    bp.frequency.exponentialRampToValueAtTime(500, t + sobe + desce);
    cG.gain.cancelScheduledValues(t); cG.gain.setValueAtTime(cG.gain.value, t);
    cG.gain.linearRampToValueAtTime(0.3 * forca, t + sobe);
    cG.gain.exponentialRampToValueAtTime(0.01, t + sobe + desce * 0.8);
    return sobe + desce + 0.5 + Math.random() * 2.5;
  }

  /* gaivota ao longe */
  function gaivota(t) {
    const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    const vol = 0.025 + Math.random() * 0.03;
    const base = 1250 + Math.random() * 350;
    const gritos = 2 + Math.floor(Math.random() * 3);
    const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1900; f.Q.value = 1.4;
    const out = ctx.createGain(); out.gain.value = vol;
    if (pan) { pan.pan.value = Math.random() * 1.6 - 0.8; f.connect(out).connect(pan); pan.connect(master); pan.connect(rev); }
    else { f.connect(out); out.connect(master); out.connect(rev); }
    for (let k = 0; k < gritos; k++) {
      const t0 = t + k * (0.38 + Math.random() * 0.12);
      const dur = k === 0 ? 0.55 : 0.3 + Math.random() * 0.1;
      const o = ctx.createOscillator(); o.type = "sawtooth";
      const vib = ctx.createOscillator(); vib.frequency.value = 26 + Math.random() * 8;
      const vibG = ctx.createGain(); vibG.gain.value = 45;
      vib.connect(vibG).connect(o.frequency);
      o.frequency.setValueAtTime(base * 0.85, t0);
      o.frequency.linearRampToValueAtTime(base * 1.15, t0 + 0.07);
      o.frequency.exponentialRampToValueAtTime(base * 0.62, t0 + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(1, t0 + 0.03);
      g.gain.setValueAtTime(1, t0 + dur * 0.5);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g).connect(f);
      o.start(t0); vib.start(t0); o.stop(t0 + dur + 0.05); vib.stop(t0 + dur + 0.05);
    }
  }

  /* passarinhos pequenos */
  function piu(t) {
    const n = 2 + Math.floor(Math.random() * 4);
    const base = 3200 + Math.random() * 1500;
    for (let k = 0; k < n; k++) {
      const t0 = t + k * (0.11 + Math.random() * 0.06);
      const o = ctx.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(base, t0);
      o.frequency.exponentialRampToValueAtTime(base * (1.3 + Math.random() * 0.3), t0 + 0.05);
      o.frequency.exponentialRampToValueAtTime(base * 0.9, t0 + 0.09);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.012, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0005, t0 + 0.09);
      o.connect(g); g.connect(master); g.connect(rev);
      o.start(t0); o.stop(t0 + 0.11);
    }
  }


  /* fogos */
  const ruidoBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const rb = ruidoBuf.getChannelData(0);
  for (let i = 0; i < rb.length; i++) rb[i] = Math.random() * 2 - 1;
  window.somLancar = (dur) => {
    if (!ligado) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(500 + Math.random() * 200, t);
    o.frequency.exponentialRampToValueAtTime(1500 + Math.random() * 400, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.012, t + 0.1);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
  };
  window.somEstouro = () => {
    if (!ligado) return;
    const t = ctx.currentTime;
    const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : ctx.createGain();
    if (pan.pan) pan.pan.value = Math.random() * 1.2 - 0.6;
    pan.connect(master); pan.connect(rev);
    const s = ctx.createBufferSource(); s.buffer = ruidoBuf;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass";
    lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(120, t + 1.2);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.55, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.6);
    s.connect(lp).connect(g).connect(pan); s.start(t); s.stop(t + 1.7);
    const n = 14 + Math.floor(Math.random() * 14);
    for (let i = 0; i < n; i++) {
      const tc = t + 0.35 + Math.random() * 1.1;
      const c = ctx.createBufferSource(); c.buffer = ruidoBuf;
      const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 2500;
      const cg = ctx.createGain();
      cg.gain.setValueAtTime(0.05 * Math.random() + 0.02, tc); cg.gain.exponentialRampToValueAtTime(0.0001, tc + 0.04);
      c.connect(hp).connect(cg).connect(pan); c.start(tc, Math.random()); c.stop(tc + 0.05);
    }
  };

  /* "chan chan" ao abrir o presente */
  window.somSurpresa = () => {
    const t = ctx.currentTime + 0.05;
    const out = ctx.createGain(); out.gain.value = 0.9;
    out.connect(ctx.destination);
    const r2 = ctx.createGain(); r2.gain.value = 0.5; out.connect(r2); r2.connect(rev); rev.connect(ctx.destination);
    function acorde(notas, t0, dur, vol) {
      notas.forEach(m => {
        [0, 6, -6].forEach(det => {
          const o = ctx.createOscillator(); o.type = "sawtooth";
          o.frequency.value = 440 * Math.pow(2, (m - 69) / 12); o.detune.value = det;
          const lp = ctx.createBiquadFilter(); lp.type = "lowpass";
          lp.frequency.setValueAtTime(900, t0); lp.frequency.linearRampToValueAtTime(3200, t0 + 0.06);
          lp.frequency.exponentialRampToValueAtTime(1200, t0 + dur);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.02);
          g.gain.setValueAtTime(vol, t0 + dur * 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          o.connect(lp).connect(g).connect(out); o.start(t0); o.stop(t0 + dur + 0.05);
        });
      });
    }
    acorde([55, 59, 62, 67], t, 0.22, 0.03);
    acorde([60, 64, 67, 72], t + 0.26, 1.8, 0.035);
    [84, 88, 91, 96, 100].forEach((m, i) => {
      const t0 = t + 0.3 + i * 0.07;
      const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.05, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.2);
      o.connect(g).connect(out); o.start(t0); o.stop(t0 + 1.3);
    });
  };
  window.silenciar = () => {
    ligado = false;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.8);
  };

  let tOnda = ctx.currentTime + 0.3, tGaivota = ctx.currentTime + 3, tPiu = ctx.currentTime + 6;
  setInterval(() => {
    const ag = ctx.currentTime + 0.5;
    while (tOnda < ag) tOnda += onda(tOnda);
    while (tGaivota < ag) { gaivota(tGaivota); tGaivota += 6 + Math.random() * 10; }
    while (tPiu < ag) { piu(tPiu); tPiu += 4 + Math.random() * 9; }
  }, 200);
}

botaoSom.addEventListener("click", () => {
  if (!ctx) return;
  ligado = !ligado;
  master.gain.cancelScheduledValues(ctx.currentTime);
  master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
  master.gain.linearRampToValueAtTime(ligado ? 0.9 : 0, ctx.currentTime + 0.6);
  document.getElementById("icone-som").setAttribute("d", ligado
    ? "M4 9h4l5-4v14l-5-4H4z M16 9a4 4 0 0 1 0 6 M18.5 6.5a8 8 0 0 1 0 11"
    : "M4 9h4l5-4v14l-5-4H4z M16 9l5 6 M21 9l-5 6");
});


/* ====== FOGOS DE ARTIFÍCIO ====== */
const cv = document.getElementById("fogos");
const g2 = cv.getContext("2d");
let foguetes = [], faiscas = [], animando = false;
const CORES = ["#ffd27a", "#ff8fa3", "#fff1d6", "#c9a0ff", "#ff9a5e", "#9fe1cb", "#ffc2d4"];
function ajustar() { const r = window.devicePixelRatio || 1; cv.width = innerWidth * r; cv.height = innerHeight * r; g2.setTransform(r, 0, 0, r, 0, 0); }
ajustar(); addEventListener("resize", ajustar);

function lancar(xFrac, alvoFrac) {
  const W = innerWidth, H = innerHeight;
  const x = W * (xFrac ?? (0.15 + Math.random() * 0.7));
  const alvo = H * (alvoFrac ?? (0.14 + Math.random() * 0.28));
  const y0 = H * 0.64;
  const tempo = 1.1 + Math.random() * 0.5;
  foguetes.push({ x, y: y0, y0, alvo, t: 0, tempo, cor: CORES[Math.floor(Math.random() * CORES.length)] });
  if (window.somLancar) somLancar(tempo);
  if (!animando) { animando = true; requestAnimationFrame(passo); }
}
function estourar(f) {
  const cor2 = CORES[Math.floor(Math.random() * CORES.length)];
  const escala = 0.15 + Math.random() * 0.05;
  const camadas = [{ n: 90, s: escala, cor: f.cor }, { n: 46, s: escala * 0.55, cor: cor2 }];
  camadas.forEach(c => {
    for (let i = 0; i < c.n; i++) {
      const t = (i / c.n) * Math.PI * 2;
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      const j = 0.97 + Math.random() * 0.06;
      faiscas.push({ x: f.x, y: f.y, px: f.x, py: f.y, vx: hx * c.s * j, vy: hy * c.s * j, vida: 1,
                     dec: 0.0075 + Math.random() * 0.002, cor: c.cor });
    }
  });
  if (window.somEstouro) somEstouro();
}
let ultimo = 0;
function passo(ts) {
  const dt = Math.min(0.05, ultimo ? (ts - ultimo) / 1000 : 0.016); ultimo = ts;
  g2.clearRect(0, 0, innerWidth, innerHeight);
  g2.globalCompositeOperation = "lighter";
  foguetes = foguetes.filter(f => {
    f.t += dt;
    const u = Math.min(1, f.t / f.tempo), e = 1 - Math.pow(1 - u, 2);
    const ny = f.y0 + (f.alvo - f.y0) * e;
    g2.strokeStyle = "rgba(255,230,190,.8)"; g2.lineWidth = 2;
    g2.beginPath(); g2.moveTo(f.x, f.y + 10); g2.lineTo(f.x, ny); g2.stroke();
    f.y = ny;
    if (u >= 1) { estourar(f); return false; }
    return true;
  });
  const k = dt * 60;
  faiscas = faiscas.filter(p => {
    p.px = p.x; p.py = p.y;
    p.vx *= Math.pow(0.975, k); p.vy = p.vy * Math.pow(0.975, k) + 0.018 * k;
    p.x += p.vx * k; p.y += p.vy * k; p.vida -= p.dec * k;
    if (p.vida <= 0) return false;
    g2.globalAlpha = Math.max(0, p.vida);
    g2.strokeStyle = p.cor; g2.lineWidth = 2;
    g2.beginPath(); g2.moveTo(p.px, p.py); g2.lineTo(p.x, p.y); g2.stroke();
    return true;
  });
  g2.globalAlpha = 1; g2.globalCompositeOperation = "source-over";
  if (foguetes.length || faiscas.length || showAtivo) requestAnimationFrame(passo);
  else { animando = false; ultimo = 0; }
}
let showAtivo = false, showTimer = null;
function show(intervalo) {
  showAtivo = true; clearInterval(showTimer);
  showTimer = setInterval(() => { lancar(); if (Math.random() < .35) setTimeout(() => lancar(), 350); }, intervalo);
  if (!animando) { animando = true; requestAnimationFrame(passo); }
}
function finale() { for (let i = 0; i < 6; i++) setTimeout(() => lancar(0.15 + i * 0.14, 0.12 + Math.random() * 0.2), i * 220); }

capa.addEventListener("click", () => {

  setTimeout(() => {

}, { once: false });
